<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaScripts Admin</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080910;color:#f4f6fb;font-family:Inter,system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:25px}.panel{background:#10131c;border:1px solid #252b39;border-radius:17px;padding:20px;margin:18px 0}input,textarea,select{width:100%;background:#0b0e15;border:1px solid #2a3040;color:#fff;border-radius:10px;padding:11px;margin:6px 0 12px;outline:0}textarea{min-height:160px;resize:vertical}button{border:0;border-radius:9px;padding:10px 14px;cursor:pointer;background:#7358ed;color:#fff;font-weight:700}.danger{background:#9b3347}.muted{color:#8e97a9}.login{max-width:420px;margin:12vh auto}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.list{display:grid;gap:10px}.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px;border:1px solid #242a38;border-radius:12px;background:#0c0f16}.actions{display:flex;gap:7px}@media(max-width:650px){.row{grid-template-columns:1fr}.item{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap">
<div id="login" class="panel login"><h2>NovaScripts Admin</h2><p class="muted">Вход администратора</p><input id="user" placeholder="Логин"><input id="pass" type="password" placeholder="Пароль"><button onclick="login()">Войти</button><p id="err" class="muted"></p></div>
<div id="app" hidden><h1>Админ-панель</h1><p class="muted">Изменения сохраняются в общей SQLite базе.</p>
<section class="panel"><h2 id="formTitle">Добавить скрипт</h2><input id="title" placeholder="Название"><div class="row"><div><input id="game" placeholder="Игра"></div><div><input id="tags" placeholder="Теги через запятую"></div></div><textarea id="description" placeholder="Описание"></textarea><textarea id="code" placeholder="Полный код скрипта"></textarea><div class="row"><input id="rating" type="number" min="0" max="5" step=".1" value="5"><select id="status"><option>Working</option><option>Offline</option><option>Beta</option></select></div><button onclick="save()">Сохранить</button> <button onclick="resetForm()">Очистить</button></section>
<section class="panel"><h2>Скрипты</h2><div id="list" class="list"></div></section></div></main>
<script>
let token=localStorage.getItem("ns_token"),editing=null;
const $=x=>document.querySelector(x);
function show(){if(token){$("#login").hidden=true;$("#app").hidden=false;load()}}
async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:$("#user").value,password:$("#pass").value})});let x=await r.json();if(!r.ok){$("#err").textContent=x.error;return}token=x.token;localStorage.setItem("ns_token",token);show()}
async function load(){let r=await fetch("/api/admin/scripts",{headers:{Authorization:"Bearer "+token}});if(r.status===401){localStorage.removeItem("ns_token");location.reload();return}let a=await r.json();$("#list").innerHTML=a.map(x=>`<div class="item"><div><b>${x.title}</b><div class="muted">${x.game} · ${x.status}</div></div><div class="actions"><button onclick='edit(${JSON.stringify(x)})'>Изменить</button><button class="danger" onclick="del(${x.id})">Удалить</button></div></div>`).join("")}
function edit(x){editing=x.id;$("#formTitle").textContent="Редактировать #"+x.id;$("#title").value=x.title;$("#game").value=x.game;$("#tags").value=x.tags.join(", ");$("#description").value=x.description;$("#code").value=x.code;$("#rating").value=x.rating;$("#status").value=x.status;scrollTo(0,0)}
function resetForm(){editing=null;$("#formTitle").textContent="Добавить скрипт";["title","game","tags","description","code"].forEach(id=>$("#"+id).value="");$("#rating").value=5;$("#status").value="Working"}
async function save(){let body={title:$("#title").value,game:$("#game").value,tags:$("#tags").value.split(",").map(x=>x.trim()).filter(Boolean),description:$("#description").value,code:$("#code").value,rating:Number($("#rating").value),status:$("#status").value};let r=await fetch(editing?"/api/admin/scripts/"+editing:"/api/admin/scripts",{method:editing?"PUT":"POST",headers:{"Content-Type":"application/json",Authorization:"Bearer "+token},body:JSON.stringify(body)});if(!r.ok){alert((await r.json()).error);return}resetForm();load()}
async function del(id){if(!confirm("Удалить этот скрипт?"))return;await fetch("/api/admin/scripts/"+id,{method:"DELETE",headers:{Authorization:"Bearer "+token}});load()}
show();
</script></body></html>
