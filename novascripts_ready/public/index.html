<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NovaScripts</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#07080d;color:#f4f6fb;font-family:Inter,system-ui,sans-serif}a{color:inherit;text-decoration:none}.wrap{max-width:1120px;margin:auto;padding:22px}.nav{border-bottom:1px solid #1d2230}.brand{font-weight:800;font-size:20px}.hero{text-align:center;padding:70px 0 35px}.hero h1{font-size:clamp(42px,7vw,72px);margin:15px 0;letter-spacing:-3px}.grad{background:linear-gradient(90deg,#fff,#9b87ff);color:transparent;background-clip:text}.muted{color:#8d95a8}.search{width:min(700px,100%);padding:16px 18px;border:1px solid #252b3a;background:#0e1119;border-radius:14px;color:white;outline:0}.cats{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.cat{border:1px solid #242a38;background:#0e1119;color:#a5adbf;padding:9px 13px;border-radius:9px;cursor:pointer}.cat.active{border-color:#6853e8;color:#cfc8ff}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;padding-bottom:70px}.card{background:#0e1119;border:1px solid #202636;border-radius:17px;padding:18px}.icon{width:45px;height:45px;border-radius:12px;background:#191e2a;display:grid;place-items:center;font-weight:800}.card h3{margin:15px 0 7px}.desc{color:#8992a6;font-size:13px;line-height:1.5;min-height:40px}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}.tag{font-size:11px;background:#181d28;padding:6px 8px;border-radius:7px;color:#abb3c3}.meta{border-top:1px solid #1e2431;padding-top:13px;display:flex;align-items:center;justify-content:space-between;color:#747e91;font-size:12px}.copy{border:0;background:#7259ee;color:#fff;padding:9px 11px;border-radius:8px;cursor:pointer}.status{color:#72e69a}.empty{text-align:center;color:#7d8799;padding:50px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}}
</style></head>
<body><div class="nav"><div class="wrap"><div class="brand">✦ NovaScripts</div></div></div>
<main class="wrap"><section class="hero"><div class="muted">ROBLOX SCRIPT HUB</div><h1>Scripts. <span class="grad">In one place.</span></h1><p class="muted">Каталог обновляется автоматически из общей базы.</p><br><input id="q" class="search" placeholder="Поиск по названию или игре..."></section>
<div id="cats" class="cats"></div><div id="grid" class="grid"></div><div id="empty" class="empty" hidden>Ничего не найдено.</div></main>
<script>
let all=[];let cat="Все";
const $=x=>document.querySelector(x);
async function load(){all=await fetch("/api/scripts").then(r=>r.json());renderCats();render()}
function renderCats(){let games=["Все",...new Set(all.map(x=>x.game))];$("#cats").innerHTML=games.map(x=>`<button class="cat ${x===cat?"active":""}" onclick="setCat(${JSON.stringify(x)})">${x}</button>`).join("")}
function setCat(x){cat=x;renderCats();render()}
function render(){let q=$("#q").value.toLowerCase();let a=all.filter(x=>(cat==="Все"||x.game===cat)&&(`${x.title} ${x.game} ${x.description} ${x.tags.join(" ")}`.toLowerCase().includes(q)));$("#grid").innerHTML=a.map(x=>`<article class="card"><div class="icon">${x.game.slice(0,2).toUpperCase()}</div><h3>${x.title}</h3><p class="desc">${x.description}</p><div class="tags">${x.tags.map(t=>`<span class="tag">${t}</span>`).join("")}</div><div class="meta"><span>★ ${x.rating} · ${x.views} views</span><button class="copy" onclick="copy(${x.id},this)">Copy Script</button></div><div class="status">● ${x.status}</div></article>`).join("");$("#empty").hidden=!!a.length}
async function copy(id,b){let x=await fetch("/api/scripts/"+id).then(r=>r.json());await navigator.clipboard.writeText(x.code);b.textContent="Copied ✓";setTimeout(()=>b.textContent="Copy Script",1200)}
$("#q").addEventListener("input",render);load();
</script></body></html>
